[build-system]
requires = ["maturin>=1.9,<2.0"]
build-backend = "maturin"

[project]
name = "hydrust"
description = "Language server and CLI checker for Hydra configuration files"
authors = [{ name = "Matthew Lyon" }]
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
keywords = ["hydra", "yaml", "lsp", "language-server", "linter"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Rust",
  "Topic :: Software Development :: Quality Assurance",
]
# Taken from `Cargo.toml` by maturin, so the two cannot drift.
dynamic = ["version"]

[project.urls]
Repository = "https://github.com/m-lyon/hydra-lsp"
Changelog = "https://github.com/m-lyon/hydra-lsp/blob/main/CHANGELOG.md"

[tool.maturin]
# A plain executable, no PyO3: the wheel installs `hydrust` into the scripts
# directory, and `python/hydrust/` only exists to find it again.
bindings = "bin"
manifest-path = "Cargo.toml"
module-name = "hydrust"
python-source = "python"
strip = true
exclude = [
  # Nothing here is needed to build the binary from the sdist.
  { path = "tests/**/*", format = "sdist" },
  { path = "docs/**/*", format = "sdist" },
  { path = ".github/**/*", format = "sdist" },
  { path = ".vscode/**/*", format = "sdist" },
]
