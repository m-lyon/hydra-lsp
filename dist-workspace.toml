[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# `build-wheels.yml` compiles each target once, so dist does not compile anything itself.
build-local-artifacts = false
local-artifacts-jobs = ["./build-wheels"]
# Runs after the GitHub Release is created.
publish-jobs = ["./publish-pypi"]
# Trusted publishing needs an OIDC token.
github-custom-job-permissions = { "publish-pypi" = { id-token = "write" } }

# Pin the Actions that dist writes into release.yml to full commit SHAs.
# Dependabot does not update release.yml (see .github/dependabot.yml), so bump
# these by hand, then run `dist generate --mode=ci`.
[dist.github-action-commits]
"actions/checkout" = "11d5960a326750d5838078e36cf38b85af677262" # v4.4.0
"actions/upload-artifact" = "ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
"actions/download-artifact" = "d3f86a106a0bac45b974a628896c90dbdf5c8093" # v4.3.0
