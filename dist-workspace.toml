[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.30.3"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = []
# Target platforms to build apps for (Rust target-triple syntax)
targets = [
    "aarch64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
]
# `build-wheels.yml` compiles each target once, so dist does not compile anything itself.
build-local-artifacts = false
local-artifacts-jobs = ["./build-wheels"]
# Runs after the GitHub Release is created.
publish-jobs = ["./publish-pypi"]
# Trusted publishing needs an OIDC token.
github-custom-job-permissions = { "publish-pypi" = { id-token = "write" } }

# Dependabot does not update release.yml (see .github/dependabot.yml), so bump
# these by hand to match build-wheels.yml, then run `dist generate --mode=ci`.
[dist.github-action-commits]
"actions/checkout" = "3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1"
"actions/upload-artifact" = "cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2"
"actions/download-artifact" = "9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2"
