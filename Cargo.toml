[package]
name = "hydrust"
version = "0.7.0"
edition = "2024"
authors = ["Matthew Lyon"]
description = "Language server and CLI checker for Hydra configuration files"
license = "MIT"
repository = "https://github.com/m-lyon/hydra-lsp"


[[bin]]
name = "hydrust"
path = "src/cli.rs"

[dependencies]
# LSP framework
tower-lsp = "0.20"
tokio = { version = "1.42", features = ["full"] }

# Async utilities
async-trait = "0.1"

# State management
dashmap = "6.1"
parking_lot = "0.13"

# YAML parsing
saphyr = "0.0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Python parsing and analysis
# These crates are from the astral-sh/ruff monorepo
ruff_python_ast = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ruff_text_size = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ruff_db = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761", features = [
    "os",
] }
ruff_source_file = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ty_module_resolver = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ty_python_core = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ty_python_semantic = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
ty_vendored = { git = "https://github.com/astral-sh/ruff", rev = "16a5a7e3e6299f3d4e1c532aef37e0ed4b0ee761" }
salsa = { version = "0.28.5", default-features = false, features = [
    "compact_str",
    "macros",
    "salsa_unstable",
    "inventory",
] }
rayon = "1"
rustc-hash = "2.1"

# Utilities
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
clap = { version = "4.5", features = ["derive"] }
colored = "3.0"
ignore = "0.4"
hashlink = "0.10.0"

[dev-dependencies]
serde = "1.0"
insta = { version = "1.45", features = ["yaml"] }
tempfile = "3.24.0"
temp-dir = "0.2"
fs_extra = "1.3"
serde_json = "1.0"
which = "7.0"
filetime = "0.2"

# Temporary: builds against a local checkout of the m-lyon/ruff fork's `hydrust-embed`
# branch until the fork is published.
[patch."https://github.com/astral-sh/ruff"]
ruff_python_ast = { path = "/home/matt/git/hydrust-dev/ruff/crates/ruff_python_ast" }
ruff_text_size = { path = "/home/matt/git/hydrust-dev/ruff/crates/ruff_text_size" }
ruff_db = { path = "/home/matt/git/hydrust-dev/ruff/crates/ruff_db" }
ruff_source_file = { path = "/home/matt/git/hydrust-dev/ruff/crates/ruff_source_file" }
ty_module_resolver = { path = "/home/matt/git/hydrust-dev/ruff/crates/ty_module_resolver" }
ty_python_core = { path = "/home/matt/git/hydrust-dev/ruff/crates/ty_python_core" }
ty_python_semantic = { path = "/home/matt/git/hydrust-dev/ruff/crates/ty_python_semantic" }
ty_vendored = { path = "/home/matt/git/hydrust-dev/ruff/crates/ty_vendored" }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
