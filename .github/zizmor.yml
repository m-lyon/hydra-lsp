# zizmor audits the workflows in CI (the `zizmor` job in ci.yml).
# Each entry below is an accepted finding. Give the reason with every new entry.
rules:
  # release.yml is generated by `dist generate --mode=ci`, so these findings
  # cannot be fixed in the file without dist overwriting the edit.
  excessive-permissions:
    ignore:
      # `contents: write` is needed to create the GitHub Release.
      - release.yml
  template-injection:
    ignore:
      # Expands `github.ref_name`, a tag name. The `v*` tag ruleset limits who
      # can create tags, and fork PRs never reach this branch of the expression.
      - release.yml
  secrets-inherit:
    ignore:
      # Both called workflows are local files in this repo. PyPI publishing
      # uses OIDC through the protected `release` environment, not a secret.
      - release.yml

  # Style hint (`$/...` instead of `./...`), not a security finding.
  self-repository:
    disable: true
