# Publish `hydrust` to PyPI.
#
# Called by `release.yml` as one of cargo dist's `publish-jobs`, so it runs only after
# the GitHub Release has been created, and uploads the wheels `build-wheels.yml`
# built earlier in that same run. If this job fails, fix the cause and use
# "Re-run failed jobs".
name: Publish to PyPI

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/hydrust/
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish -v wheels/*
