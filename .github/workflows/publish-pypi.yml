# Publish `hydrust` to PyPI.
#
# Called by `release.yml` as one of dist's `publish-jobs`, so it runs only after
# the GitHub Release has been created, and uploads the wheels `build-wheels.yml`
# built earlier in that same run. dist checks the tag against `Cargo.toml`
# before anything is built, and skips this job for a prerelease tag.
#
# If this job fails, fix the cause and use "Re-run failed jobs" on the Release
# run so PyPI catches up with the GitHub release; do not cut a new tag. Re-running
# all jobs would rebuild the wheels, and PyPI rejects a rebuilt wheel whose name
# matches an already-uploaded file but whose contents differ.
#
# PyPI's trusted publisher is registered against `release.yml`, not this file:
# PyPI checks the top-level workflow. The `release` environment has to stay on
# the job that publishes.
name: Publish to PyPI

on:
  workflow_call:
    inputs:
      # dist's plan manifest. Unused.
      plan:
        required: true
        type: string

jobs:
  publish:
    name: Upload to PyPI
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/hydrust/
    # `release.yml` grants only this; asking for anything more fails the run.
    permissions:
      id-token: write
    steps:
      - uses: astral-sh/setup-uv@v10.2.0
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: wheels
          merge-multiple: true
      - name: Publish to PyPI
        run: uv publish -v wheels/*
