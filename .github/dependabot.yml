version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # dist generates release.yml from dist-workspace.toml, and CI fails if the
    # two differ. Update the pins in [dist.github-action-commits] by hand.
    exclude-paths:
      - .github/workflows/release.yml
    # Wait a week after a release before proposing it, so a compromised
    # release has time to be found and pulled.
    cooldown:
      default-days: 7
    # build-wheels.yml keeps its artifacts-* uploads on v4 to match the
    # download-artifact major in release.yml. Move both majors together by hand.
    ignore:
      - dependency-name: actions/upload-artifact
        update-types: ["version-update:semver-major"]
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    # saphyr hands back mappings as hashlink's LinkedHashMap, so our hashlink
    # must be the same version as saphyr's or the types don't match. Bump it
    # together with saphyr.
    ignore:
      - dependency-name: hashlink
      # Major upgrades are done by hand.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      cargo-minor-and-patch:
        update-types: [minor, patch]
